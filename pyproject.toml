[project]
name = "verifix"
version = "0.1.0"
description = "A verification sidecar for AI agents that act on networks"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "fastapi>=0.110", "uvicorn>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verifix*"]

[tool.pytest.ini_options]
# experiments/ is run from the repo root and is not an installed package, so
# its tests need the root on the import path, as `python -m` gives it.
pythonpath = ["."]
